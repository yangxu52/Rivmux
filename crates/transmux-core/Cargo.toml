[package]
name = "rivmux_transmux_core"
description = "Rivmux transmux WASM core"
repository = "git+https://github.com/yangxu52/rivmux.git"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[[bench]]
name = "core"
harness = false

[features]
default = ["wasm"]
serde = ["dep:serde"]
wasm = ["serde", "dep:serde-wasm-bindgen", "dep:wasm-bindgen"]

# `strip = "symbols"` (workspace release profile) already removes the name
# section, which is the dominant high-entropy payload. It also removes the
# `target_features` section, so wasm-opt can no longer validate the artifact
# and would fail. The residual code-optimization gain is ~23 B brotli, which
# does not justify restoring wasm-opt.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
