name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          node scripts/validate-release.cjs --tag "${tag}"

          if [[ "${tag}" == *alpha* || "${tag}" == *beta* || "${tag}" == *rc* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Run lint check
        run: pnpm run lint:check

      - name: Run Rust clippy
        run: pnpm run clippy

      - name: Run type check
        run: pnpm run typecheck

      - name: Run test
        run: pnpm run test:ci

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser test
        run: pnpm run test:browser

      - name: Run build
        run: pnpm run build

      - name: Create release artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="${RUNNER_TEMP}/rivmux-release"
          rm -rf "${artifact_dir}"
          mkdir -p "${artifact_dir}"
          pnpm --filter @rivmux/protocol pack --pack-destination "${artifact_dir}"
          pnpm --filter @rivmux/runtime-worker pack --pack-destination "${artifact_dir}"
          pnpm --filter rivmux pack --pack-destination "${artifact_dir}"

      - name: Validate release artifacts
        run: node scripts/validate-release.cjs --version "${{ steps.release.outputs.version }}" --require-generated --artifacts "${RUNNER_TEMP}/rivmux-release"

      - name: Publish packages
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --filter @rivmux/protocol publish --access public --no-git-checks
          pnpm --filter @rivmux/runtime-worker publish --access public --no-git-checks
          pnpm --filter rivmux publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release for tag
        uses: softprops/action-gh-release@v3
        with:
          name: Rivmux v${{ steps.release.outputs.version }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          body: |
            Please refer to [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.
